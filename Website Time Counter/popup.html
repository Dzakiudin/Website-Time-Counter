<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Time Counter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            width: 300px;
            padding: 10px;
            background-color: #f4f6f8;
            color: #333;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 18px;
            margin: 0;
            color: #1a202c;
        }
        #reset-button {
            border: none;
            background-color: #e2e8f0;
            color: #4a5568;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        #reset-button:hover {
            background-color: #cbd5e0;
        }
        #data-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .site-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid #eef1f4;
            font-size: 14px;
        }
        .site-entry:last-child {
            border-bottom: none;
        }
        .site-domain {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 10px;
        }
        .site-time {
            font-weight: 400;
            color: #555;
            background-color: #e9ecef;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
        }
        #no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Waktu Hari Ini</h1>
        <button id="reset-button" title="Hapus semua data hari ini">Reset</button>
    </div>
    
    <div id="data-container">
        <!-- Data waktu akan dimuat di sini oleh popup.js -->
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
